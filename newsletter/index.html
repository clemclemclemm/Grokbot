<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Six numbers you rarely see</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=PT+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --yellow: #FFBD00;
      --ink: #181818;
      --cream: #F3F0E8;
      --surface: #F9F7F1;
      --muted: rgba(24, 24, 24, 0.55);
      --muted-2: rgba(24, 24, 24, 0.38);
      --line: rgba(24, 24, 24, 0.08);
      --shadow-out: 8px 8px 18px rgba(24, 24, 24, 0.10);
      --shadow-in-light: -5px -5px 14px rgba(255, 255, 255, 0.85);
      --radius: 16px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: "Sofia Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 14px 40px;
    }
    .eyebrow {
      font-family: "PT Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 16px;
      height: 3px;
      background: var(--yellow);
      margin-right: 8px;
      vertical-align: middle;
      border-radius: 1px;
    }
    h1 {
      font-family: Adam, "Arial Narrow", "Helvetica Neue", sans-serif;
      font-weight: 700;
      font-size: clamp(26px, 7.5vw, 42px);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin: 0;
      line-height: 0.98;
    }
    .lede {
      margin: 10px 0 0;
      max-width: 32em;
      font-size: 14px;
      color: var(--muted);
    }
    .hint {
      margin: 8px 0 0;
      font-family: "PT Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted-2);
    }
    .rule {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, var(--yellow), transparent 70%);
      margin: 18px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
      .page { padding: 32px 24px 56px; }
      .lede { font-size: 15px; }
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 14px 12px 14px;
      box-shadow: var(--shadow-out), var(--shadow-in-light);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.25s var(--ease),
        box-shadow 0.25s var(--ease),
        border-color 0.25s var(--ease);
      font: inherit;
      color: inherit;
    }
    .card::after {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--yellow);
      transform: scaleY(0.3);
      transform-origin: top;
      transition: transform 0.28s var(--ease);
      opacity: 0.85;
    }
    .card[aria-expanded="true"] {
      border-color: rgba(255, 189, 0, 0.5);
      box-shadow:
        10px 12px 24px rgba(24, 24, 24, 0.12),
        -6px -6px 16px rgba(255, 255, 255, 0.9),
        0 8px 22px rgba(255, 189, 0, 0.14);
      grid-column: 1 / -1;
    }
    .card[aria-expanded="true"]::after { transform: scaleY(1); }
    @media (hover: hover) and (pointer: fine) {
      .card:hover:not([aria-expanded="true"]) {
        transform: translateY(-3px);
        border-color: rgba(255, 189, 0, 0.35);
      }
    }
    .card:active { transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover { transform: none; }
    }
    .card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 10px;
      background: var(--cream);
      box-shadow:
        inset 2px 2px 5px rgba(24, 24, 24, 0.06),
        inset -2px -2px 5px rgba(255, 255, 255, 0.8);
      display: grid;
      place-items: center;
      color: var(--ink);
    }
    .icon svg {
      width: 18px;
      height: 18px;
      stroke: #181818;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon .fill-ink { fill: #181818; stroke: none; }
    .icon .fill-yellow { fill: #FFBD00; stroke: none; }
    .icon .stroke-yellow { stroke: #FFBD00; }
    .card-label { flex: 1; min-width: 0; }
    .title {
      font-family: Adam, "Arial Narrow", "Helvetica Neue", sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0;
      color: var(--muted);
      line-height: 1.25;
    }
    .stat {
      font-family: "PT Mono", ui-monospace, monospace;
      font-size: clamp(20px, 5.5vw, 26px);
      color: var(--ink);
      margin: 2px 0 0;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .stat .accent { color: var(--ink); font-weight: 700; } /* Golfi: #FFBD00 text on cream forbidden */
    .detail {
      display: none;
      width: 100%;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    .card[aria-expanded="true"] .detail { display: block; }
    .stat-sub {
      font-family: "PT Mono", ui-monospace, monospace;
      font-size: 10px;
      color: var(--muted-2);
      margin: 0;
      letter-spacing: 0.02em;
      line-height: 1.4;
    }
    .comment {
      margin: 8px 0 0;
      font-size: 14px;
      color: rgba(24, 24, 24, 0.78);
    }
    footer {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      color: var(--muted-2);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Industry signal · Australia</p>
    <h1>Six numbers you rarely see</h1>
    <p class="lede">World → Australia. Not a pitch — a scan for leaders, finance and ops.</p>
    <p class="hint">Tap a number for detail</p>
    <hr class="rule" />

    <section class="grid" aria-label="Six industry numbers">
      <button type="button" class="card" aria-expanded="false" data-id="1">
        <div class="card-top">
          <span class="icon" aria-hidden="true">
            <!-- 3×3 density grid, one filled -->
            <svg viewBox="0 0 24 24">
              <circle cx="6" cy="6" r="1.4" class="fill-ink"/>
              <circle cx="12" cy="6" r="1.4" class="fill-ink"/>
              <circle cx="18" cy="6" r="1.4" class="fill-ink"/>
              <circle cx="6" cy="12" r="1.4" class="fill-ink"/>
              <circle cx="12" cy="12" r="2" class="fill-yellow"/>
              <circle cx="18" cy="12" r="1.4" class="fill-ink"/>
              <circle cx="6" cy="18" r="1.4" class="fill-ink"/>
              <circle cx="12" cy="18" r="1.4" class="fill-ink"/>
              <circle cx="18" cy="18" r="1.4" class="fill-ink"/>
            </svg>
          </span>
          <div class="card-label">
            <p class="title">World density</p>
            <p class="stat">177 <span class="accent">/</span> 10k</p>
          </div>
        </div>
        <div class="detail">
          <p class="stat-sub">robots · manuf. employees · world · 2024 · IFR</p>
          <p class="comment">Global density rose again. Not automating now means benchmarking against yesterday’s plant.</p>
        </div>
      </button>

      <button type="button" class="card" aria-expanded="false" data-id="2">
        <div class="card-top">
          <span class="icon" aria-hidden="true">
            <!-- unequal bars: height encodes; yellow = accent mark only -->
            <svg viewBox="0 0 24 24">
              <rect x="5" y="5" width="5" height="14" rx="1" class="fill-ink"/>
              <rect x="14" y="12" width="5" height="7" rx="1"/>
              <path d="M5 19h14" class="stroke-yellow"/>
            </svg>
          </span>
          <div class="card-label">
            <p class="title">China vs world</p>
            <p class="stat">3.2<span class="accent">×</span></p>
          </div>
        </div>
        <div class="detail">
          <p class="stat-sub">China density vs world · 567 ÷ 177 · 2024 · IFR</p>
          <p class="comment">Factories that win on exports already put robots at the centre. The gap with late movers shows up in productivity — not in decks.</p>
        </div>
      </button>

      <button type="button" class="card" aria-expanded="false" data-id="3">
        <div class="card-top">
          <span class="icon" aria-hidden="true">
            <!-- chip | > | car outline -->
            <svg viewBox="0 0 24 24">
              <rect x="2.5" y="7" width="7" height="10" rx="1.2"/>
              <path d="M5 10h2M5 13h2"/>
              <path d="M11 12h2.5" class="stroke-yellow"/>
              <path d="M12.2 10.2L14.5 12l-2.3 1.8" class="stroke-yellow"/>
              <path d="M16 14h5l-.8-3.2c-.1-.5-.5-.8-1-.8h-2.4c-.4 0-.8.3-.9.7L16 14z"/>
              <circle cx="17.2" cy="14.2" r="0.9" class="fill-ink"/>
              <circle cx="19.8" cy="14.2" r="0.9" class="fill-ink"/>
            </svg>
          </span>
          <div class="card-label">
            <p class="title">Elec over auto</p>
            <p class="stat">Elec <span class="accent">&gt;</span> Auto</p>
          </div>
        </div>
        <div class="detail">
          <p class="stat-sub">128,899 vs 126,088 installs · 2024 · IFR</p>
          <p class="comment">In 2024, electronics overtook automotive again. Automation follows the supply chains that move — not only the historic plants.</p>
        </div>
      </button>

      <button type="button" class="card" aria-expanded="false" data-id="4">
        <div class="card-top">
          <span class="icon" aria-hidden="true">
            <!-- small 1-storey vs tall 3-storey -->
            <svg viewBox="0 0 24 24">
              <rect x="3" y="13" width="7" height="7" rx="0.8"/>
              <path d="M5 15.5h3"/>
              <rect x="13" y="4" width="8" height="16" rx="0.8"/>
              <path d="M15 7h4M15 10.5h4M15 14h4" class="stroke-yellow"/>
            </svg>
          </span>
          <div class="card-label">
            <p class="title">AI size gap</p>
            <p class="stat">3.2<span class="accent">×</span></p>
          </div>
        </div>
        <div class="detail">
          <p class="stat-sub">AU AI · large ÷ small/micro · ~35% ÷ ~11% · 2024–25 · ABS</p>
          <p class="comment">Only ~12% of Australian businesses use AI — but ~35% of large ones. The gap isn’t tech; it’s size. Mid-market sits in between.</p>
        </div>
      </button>

      <button type="button" class="card" aria-expanded="false" data-id="5">
        <div class="card-top">
          <span class="icon" aria-hidden="true">
            <!-- rising arrow from baseline -->
            <svg viewBox="0 0 24 24">
              <path d="M4 18h16"/>
              <path d="M6 14l5-5 3 3 5-6" class="stroke-yellow"/>
              <path d="M16 6h3.5v3.5" class="stroke-yellow"/>
            </svg>
          </span>
          <div class="card-label">
            <p class="title">AU IVA lift</p>
            <p class="stat"><span class="accent">+</span>A$6.2bn</p>
          </div>
        </div>
        <div class="detail">
          <p class="stat-sub">AU manuf. IVA abs. · 141,973 − 135,724 m · ABS</p>
          <p class="comment">Australian manufacturing is still adding real value. The question isn’t whether industry exists here — it’s how fast the mid-market modernises.</p>
        </div>
      </button>

      <button type="button" class="card" aria-expanded="false" data-id="6">
        <div class="card-top">
          <span class="icon" aria-hidden="true">
            <!-- thin share vs full track — no pie (Golfi: no camembert) -->
            <svg viewBox="0 0 24 24">
              <rect x="3" y="10" width="18" height="4" rx="1"/>
              <rect x="3" y="10" width="4" height="4" rx="1" class="fill-yellow" stroke="none"/>
            </svg>
          </span>
          <div class="card-label">
            <p class="title">Thin GDP share</p>
            <p class="stat">5.4<span class="accent">%</span></p>
          </div>
        </div>
        <div class="detail">
          <p class="stat-sub">AU manuf. of GDP · 2024 · World Bank · vs DE 18.0% · CN 24.8%</p>
          <p class="comment">We’re not a factory economy. Every point of manufacturing productivity matters more: little volume, little room for inefficiency.</p>
        </div>
      </button>
    </section>

    <footer>
      Sources: IFR World Robotics 2025 Foreword · ABS · World Bank NV.IND.MANF.ZS<br />
      Ratios shown with transparent inputs.
    </footer>
  </main>
  <script>
    (function () {
      var cards = Array.prototype.slice.call(document.querySelectorAll(".card"));
      cards.forEach(function (card) {
        card.addEventListener("click", function () {
          var open = card.getAttribute("aria-expanded") === "true";
          cards.forEach(function (c) { c.setAttribute("aria-expanded", "false"); });
          if (!open) card.setAttribute("aria-expanded", "true");
        });
      });
    })();
  </script>
</body>
</html>
